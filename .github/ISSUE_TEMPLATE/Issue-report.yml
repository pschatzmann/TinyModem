name: Bug report
description: Report only bugs here!
body:
  - type: markdown
    attributes:
      value: |
        * Before reporting a new bug please check and search the [list of existing issues](https://github.com/pschatzmann/TinyModem/issues?q=)
        * Please check [the Readme](https://github.com/pschatzmann/TinyModem) and [the Wiki](https://github.com/pschatzmann/TinyModem/wiki)
        * Don't forget to check [the discussions](https://github.com/pschatzmann/TinyModem/discussions)
        * If still experiencing the issue, please provide as many details as possible below about your hardware, computer setup and code.
  - type: textarea
    id: Description
    attributes:
      label: Problem Description
      description: Please describe your problem here and expected behaviour
      placeholder: ex. Nothing is decoded/wrong characters/crash..
    validations:
      required: true
  - type: textarea
    id: Modem
    attributes:
      label: Modem Type and Settings
      description: Which modem type and mode are you using (FSK, MFSK, PSK, OFDM, AX.25, Packets) and which settings did you change?
      placeholder: e.g. FSK 1200, mfsk16, psk31, ofdm32 with Packets, aprs; sample rate 44100
    validations:
      required: true
  - type: textarea
    id: Board
    attributes:
      label: Device Description
      description: What development board and audio hardware are you using
      placeholder: e.g. ESP32 Wroom with I2S DAC/ADC, RP2040 with PWM output, Desktop build with sound card or WAV file
    validations:
       required: true
  - type: textarea
    id: sketch
    attributes:
      label: Sketch
      description: Please provide full minimal sketch/code or the tinymodem command line which can be run to reproduce your issue
      placeholder: ex. Related part of the code to replicate the issue
      render: cpp
    validations:
     required: true

  - type: textarea
    id: other-remarks
    attributes:
      label: Other Steps to Reproduce
      description: Is there any other information you can think of which will help us reproduce this problem? A WAV file of the signal helps a lot.
      placeholder: ex. I also tried on other OS, HW...it works correctly on that setup.

  - type: textarea
    id: sceanario
    attributes:
      label: What is your development environment (incl. core version info)
      description: Please provide the information about your development/runtime environment
      placeholder: Arduino ESP 3.1.1, arduino-audio-tools version, PlatformIO ESP32 6.10.0, Desktop Build with CMake

  - type: checkboxes
    id: confirmation
    attributes:
      label: I have checked existing issues, discussions and online documentation
      description: You agree to check all the resources above before opening a new issue.
      options:
        - label: I confirm I have checked existing issues, discussions and online documentation
          required: true
